[project]
name = "bedrock-mcp-blueprint"
version = "0.1.0"
description = "A small MCP server on Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3",
]

[dependency-groups]
# scripts/mcp_client.py signs requests with AWS credentials; not needed in the image.
client = [
    "boto3",
    "httpx2",
]
dev = [
    "pytest",
    { include-group = "client" },
]
